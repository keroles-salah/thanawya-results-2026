<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة الثانوية العامة 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.container { width: 100%; max-width: 520px; }
.header { text-align: center; margin-bottom: 30px; }
.header h1 {
    font-size: 2rem; color: #fff; margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(99,102,241,0.4);
}
.subtitle { color: #94a3b8; font-size: 0.95rem; }
.search-box { display: flex; gap: 10px; margin-bottom: 20px; }
.search-box input {
    flex: 1; padding: 14px 18px;
    border: 2px solid rgba(99,102,241,0.3); border-radius: 12px;
    font-size: 1.1rem; background: rgba(255,255,255,0.06);
    color: #fff; outline: none; direction: ltr; text-align: center;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.search-box input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
}
.search-box input::placeholder { color: #64748b; }
.search-box button {
    padding: 14px 28px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none; border-radius: 12px;
    color: #fff; font-size: 1.05rem; font-weight: 600;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
}
.search-box button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(99,102,241,0.4);
}
.search-box button:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }
.loader { text-align: center; padding: 20px; font-size: 1.1rem; color: #94a3b8; }
.error {
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px; padding: 16px 20px; color: #fca5a5;
    font-size: 1rem; text-align: center;
}
.result-card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(99,102,241,0.25);
    border-radius: 16px; overflow: hidden; backdrop-filter: blur(10px);
}
.result-header {
    background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
    padding: 16px 20px; font-size: 1.2rem; font-weight: 700; color: #fff; text-align: center;
}
.field {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.field:last-child { border-bottom: none; }
.label { color: #94a3b8; font-size: 0.9rem; font-weight: 500; }
.value { color: #e2e8f0; font-size: 0.95rem; font-weight: 600; }
.value.ltr { direction: ltr; text-align: left; }
.value.name { color: #fff; font-size: 1rem; }
.value.degree { color: #fbbf24; font-size: 1.1rem; }
.value.case { color: #34d399; }
.footer { text-align: center; margin-top: 40px; color: #64748b; font-size: 0.85rem; line-height: 1.8; }
.footer .count { color: #6366f1; font-weight: 600; }
.hidden { display: none; }
@media (max-width: 480px) {
    .header h1 { font-size: 1.5rem; }
    .search-box { flex-direction: column; }
    .search-box button { width: 100%; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>&#127891; نتيجة الثانوية العامة 2026</h1>
        <p class="subtitle">نظام حديث — البحث برقم الجلوس</p>
    </div>
    <div class="search-box">
        <input type="text" id="seatingNo" placeholder="&#128269; اكتب رقم الجلوس..." inputmode="numeric" autocomplete="off" autofocus>
        <button id="searchBtn" onclick="search()">بحث</button>
    </div>
    <div id="loader" class="loader hidden">&#9203; جاري البحث...</div>
    <div id="error" class="error hidden"></div>
    <div id="result" class="result-card hidden"></div>
    <div class="footer">
        <p>بيانات الدور الأول 2026 &mdash; نتائج غير رسمية</p>
        <p class="count">عدد الطلاب: <strong dir="ltr">919,396</strong> طالب</p>
        <p style="margin-top:8px;">للاستعلام أدخل رقم الجلوس المكون من 7 أرقام</p>
    </div>
</div>
<script>
const input = document.getElementById('seatingNo');
const btn = document.getElementById('searchBtn');
const loader = document.getElementById('loader');
const error = document.getElementById('error');
const result = document.getElementById('result');

input.addEventListener('keydown', function(e) { if (e.key === 'Enter') search(); });

async function search() {
    const sno = input.value.trim();
    if (!sno) return;
    if (!/^\d{7}$/.test(sno)) {
        error.textContent = '\u26A0\uFE0F \u0631\u0642\u0645 \u0627\u0644\u062C\u0644\u0648\u0633 \u064A\u062C\u0628 \u0623\u0646 \u064A\u0643\u0648\u0646 \u0667 \u0623\u0631\u0642\u0627\u0645';
        error.classList.remove('hidden');
        return;
    }

    loader.classList.remove('hidden');
    error.classList.add('hidden');
    result.classList.add('hidden');
    btn.disabled = true;

    try {
        const prefix = sno.substring(0, 4);
        const url = 'data/' + prefix + '.json';

        const res = await fetch(url);
        if (!res.ok) {
            if (res.status === 404) {
                error.textContent = '\uD83D\uDEAB \u0644\u0627 \u062A\u0648\u062C\u062F \u0646\u062A\u064A\u062C\u0629 \u0644\u0631\u0642\u0645 \u0627\u0644\u062C\u0644\u0648\u0633 ' + sno;
            } else {
                error.textContent = '\u062D\u062F\u062B \u062E\u0637\u0623 \u0641\u064A \u0627\u0644\u0627\u062A\u0635\u0627\u0644. \u062D\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062E\u0631\u0649.';
            }
            error.classList.remove('hidden');
            return;
        }

        const bucket = await res.json();
        const student = bucket[sno];

        if (!student) {
            error.textContent = '\uD83D\uDEAB \u0644\u0627 \u062A\u0648\u062C\u062F \u0646\u062A\u064A\u062C\u0629 \u0644\u0631\u0642\u0645 \u0627\u0644\u062C\u0644\u0648\u0633 ' + sno;
            error.classList.remove('hidden');
            return;
        }

        const isSuccess = student.c.includes('\u0646\u0627\u062C\u062D');
        const emoji = isSuccess ? '\u2705' : '\u26A0\uFE0F';
        const caseClass = isSuccess ? 'case' : '';

        result.innerHTML =
            '<div class="result-header">' + emoji + ' \u0646\u062A\u064A\u062C\u0629 \u0627\u0644\u0637\u0627\u0644\u0628</div>' +
            '<div class="field"><span class="label">\u0631\u0642\u0645 \u0627\u0644\u062C\u0644\u0648\u0633</span><span class="value ltr">' + sno + '</span></div>' +
            '<div class="field"><span class="label">\u0627\u0644\u0627\u0633\u0645</span><span class="value name">' + student.n + '</span></div>' +
            '<div class="field"><span class="label">\u0627\u0644\u0645\u062C\u0645\u0648\u0639</span><span class="value degree ltr">' + student.d + ' / 410</span></div>' +
            '<div class="field"><span class="label">\u0627\u0644\u062D\u0627\u0644\u0629</span><span class="value ' + caseClass + '">' + student.c + '</span></div>';
        result.classList.remove('hidden');

    } catch(e) {
        error.textContent = '\u062D\u062F\u062B \u062E\u0637\u0623 \u0641\u064A \u0627\u0644\u0627\u062A\u0635\u0627\u0644. \u062D\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062E\u0631\u0649.';
        error.classList.remove('hidden');
    } finally {
        loader.classList.add('hidden');
        btn.disabled = false;
    }
}
</script>
</body>
</html>
