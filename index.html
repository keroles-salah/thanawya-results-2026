<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة الثانوية العامة 2026 — البحث برقم الجلوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
    --blue-50:#eff6ff;--blue-100:#dbeafe;--blue-500:#3b82f6;--blue-600:#2563eb;--blue-700:#1d4ed8;--blue-900:#1e3a5f;
    --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;--slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;--slate-950:#020617;
    --green-500:#22c55e;--green-600:#16a34a;--green-700:#15803d;
    --red-500:#ef4444;--red-600:#dc2626;
    --amber-400:#fbbf24;--amber-500:#f59e0b;--amber-600:#d97706;
    --purple-500:#8b5cf6;--purple-600:#7c3aed;
    --radius:16px;--radius-sm:10px;--radius-xs:6px;
    --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.05);
    --shadow:0 1px 3px 0 rgba(0,0,0,0.1),0 1px 2px -1px rgba(0,0,0,0.1);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -2px rgba(0,0,0,0.1);
    --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -4px rgba(0,0,0,0.1);
    --shadow-xl:0 20px 25px -5px rgba(0,0,0,0.1),0 8px 10px -6px rgba(0,0,0,0.1);
}
html{scroll-behavior:smooth}
body{
    font-family:'Cairo',system-ui,-apple-system,sans-serif;
    background:var(--slate-950);
    color:var(--slate-200);
    min-height:100vh;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
}
/* Banner */
.bnr{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,#0088cc,#00a2ed);
    color:#fff;text-align:center;padding:9px 12px;
    font-size:.82rem;font-weight:600;letter-spacing:-0.01em;
    display:flex;align-items:center;justify-content:center;gap:6px;
    flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,136,204,.25);
}
.bnr a{color:#fff;font-weight:800;text-decoration:none;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:20px;transition:background .2s}
.bnr a:hover{background:rgba(255,255,255,.28)}

/* Layout */
.page{max-width:640px;margin:0 auto;padding:24px 16px 48px}
@media(min-width:640px){.page{padding:32px 20px 64px}}

/* Hero */
.hero{text-align:center;padding:32px 0 28px}
.hero-icon{font-size:2.8rem;margin-bottom:12px;display:block}
.hero h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:900;color:#fff;margin-bottom:4px;letter-spacing:-0.02em}
.hero p{color:var(--slate-400);font-size:.92rem;font-weight:500}
.hero-stats{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.hs-item{
    background:var(--slate-900);border:1px solid var(--slate-800);
    border-radius:var(--radius-sm);padding:10px 18px;text-align:center;
    transition:border-color .25s;
}
.hs-item:hover{border-color:var(--slate-700)}
.hs-num{font-size:1.25rem;font-weight:800;color:var(--blue-500);letter-spacing:-0.02em}
.hs-lbl{font-size:.7rem;color:var(--slate-500);margin-top:1px;text-transform:uppercase;letter-spacing:.04em}

/* Tabs */
.tabs{
    display:grid;grid-template-columns:1fr 1fr;gap:2px;
    background:var(--slate-900);border:1px solid var(--slate-800);
    border-radius:var(--radius-sm);padding:3px;margin-bottom:20px;
}
.tab-btn{
    padding:12px 16px;border:none;background:transparent;
    color:var(--slate-400);font-size:.9rem;font-weight:600;
    font-family:'Cairo',sans-serif;cursor:pointer;
    border-radius:8px;transition:all .25s;
    display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab-btn.active{background:var(--blue-600);color:#fff;box-shadow:var(--shadow-md)}
.tab-btn:hover:not(.active){color:var(--slate-300);background:var(--slate-800)}

/* Panels */
.panel{display:none}
.panel.active{display:block}

/* Search */
.search-group{display:flex;gap:8px;margin-bottom:18px}
.search-group input{
    flex:1;padding:14px 18px;border:2px solid var(--slate-800);
    border-radius:var(--radius-sm);background:var(--slate-900);
    color:#fff;font-size:1.1rem;font-family:'Cairo',sans-serif;
    outline:none;transition:border-color .25s,box-shadow .25s;
    direction:ltr;text-align:center;letter-spacing:.08em;font-weight:700;
}
.search-group input:focus{border-color:var(--blue-500);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.search-group input::placeholder{color:var(--slate-500);letter-spacing:0;font-weight:400;font-size:.92rem}
.search-group input.arabic{direction:rtl;text-align:right;letter-spacing:0;font-weight:500}
.search-group button{
    padding:14px 24px;border:none;border-radius:var(--radius-sm);
    background:var(--blue-600);color:#fff;font-size:1.05rem;
    font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;
    transition:all .25s;white-space:nowrap;
    box-shadow:0 2px 8px rgba(37,99,235,.3);
}
.search-group button:hover{background:var(--blue-500);transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.35)}
.search-group button:active{transform:translateY(0)}
.search-group button:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* States */
.spinner-wrap{text-align:center;padding:28px}
.spinner{width:32px;height:32px;border:3px solid var(--slate-800);border-top-color:var(--blue-500);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{
    background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);
    border-radius:var(--radius-sm);padding:16px 20px;color:#fca5a5;
    text-align:center;font-size:.92rem;margin-bottom:12px;
}
.rs-count{
    text-align:center;padding:10px 16px;margin-bottom:10px;
    background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.12);
    border-radius:var(--radius-sm);color:var(--blue-500);font-weight:600;font-size:.85rem;
}

/* Result Card */
.card{
    background:var(--slate-900);border:1px solid var(--slate-800);
    border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow-lg);margin-bottom:14px;
    animation:slideUp .45s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card-head{
    padding:16px 20px;text-align:center;
    border-bottom:1px solid var(--slate-800);
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:1.05rem;font-weight:700;color:#fff;
}
.card-head.success{background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(22,163,74,.06))}
.card-head.fail{background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(220,38,38,.05))}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green-500);box-shadow:0 0 10px rgba(34,197,94,.4)}
.dot.red{background:var(--red-500);box-shadow:0 0 10px rgba(239,68,68,.4)}

/* Body */
.card-body{padding:20px}
.name-block{text-align:center;margin-bottom:20px}
.name-block .s-name{font-size:1.25rem;font-weight:800;color:#fff;line-height:1.7;margin-bottom:4px}
.name-block .s-seat{font-size:.82rem;color:var(--slate-500);letter-spacing:0}

/* Badges */
.tags{display:flex;justify-content:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tag{
    display:inline-flex;align-items:center;gap:4px;
    padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:600;
    border:1px solid transparent;
}
.tag-branch{background:rgba(139,92,246,.12);color:#c4b5fd;border-color:rgba(139,92,246,.2)}
.tag-school{background:rgba(59,130,246,.1);color:#93c5fd;border-color:rgba(59,130,246,.18)}
.tag-pct{background:rgba(245,158,11,.1);color:var(--amber-400);border-color:rgba(245,158,11,.18)}

/* Score */
.score-zone{text-align:center;margin-bottom:18px}
.score-ring{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:100px;height:100px;border-radius:50%;
    background:rgba(245,158,11,.08);border:2px solid rgba(245,158,11,.2);
}
.score-num{font-size:2rem;font-weight:900;color:var(--amber-400);line-height:1}
.score-max{font-size:.7rem;color:var(--slate-500);margin-top:2px}

/* Ranks */
.ranks{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;
}
.rank-cell{
    background:var(--slate-950);border:1px solid var(--slate-800);
    border-radius:var(--radius-sm);padding:14px 12px;text-align:center;
    transition:border-color .25s;
}
.rank-cell:hover{border-color:var(--slate-700)}
.rank-cell .rk-icon{font-size:1.2rem;margin-bottom:3px}
.rank-cell .rk-lbl{font-size:.7rem;color:var(--slate-500);margin-bottom:3px}
.rank-cell .rk-val{font-size:1.1rem;font-weight:800;color:var(--amber-400)}

/* Status line */
.status-line{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 0;border-top:1px solid var(--slate-800);border-bottom:1px solid var(--slate-800);
    margin-bottom:14px;
}
.status-line .sl-lbl{font-size:.82rem;color:var(--slate-400)}
.status-line .sl-val{font-size:.88rem;font-weight:700}
.status-line .sl-val.ok{color:var(--green-500)}
.status-line .sl-val.no{color:var(--red-500)}

/* Subjects grid */
.subjects{margin-top:4px}
.subjects h4{
    font-size:.82rem;color:var(--slate-400);font-weight:600;
    text-align:center;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sub-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--slate-950);border:1px solid var(--slate-800);
    border-radius:var(--radius-xs);padding:9px 12px;
    transition:border-color .2s;
}
.sub-item:hover{border-color:var(--slate-700)}
.sub-item .si-name{font-size:.75rem;color:var(--slate-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-item .si-mark{font-size:.78rem;font-weight:700;color:var(--slate-200);white-space:nowrap}
.sub-item .si-mark.na{color:var(--slate-600);font-weight:400}

/* Share */
.share-bar{padding:20px 0 0;border-top:1px solid var(--slate-800);margin-top:6px}
.share-bar .sh-title{text-align:center;color:var(--slate-500);font-size:.78rem;font-weight:600;margin-bottom:12px}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sh-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 12px;border-radius:var(--radius-sm);border:1px solid transparent;
    font-size:.82rem;font-weight:600;font-family:'Cairo',sans-serif;
    cursor:pointer;transition:all .25s;color:#fff;
}
.sh-btn:hover{transform:translateY(-1px)}
.sh-wa{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.2);color:#4ade80}
.sh-wa:hover{background:rgba(37,211,102,.2);box-shadow:0 4px 16px rgba(37,211,102,.15)}
.sh-tg{background:rgba(0,136,204,.12);border-color:rgba(0,136,204,.2);color:#38bdf8}
.sh-tg:hover{background:rgba(0,136,204,.2);box-shadow:0 4px 16px rgba(0,136,204,.15)}
.sh-img{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.18);color:#c4b5fd}
.sh-img:hover{background:rgba(139,92,246,.18);box-shadow:0 4px 16px rgba(139,92,246,.12)}
.sh-link{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.16);color:var(--amber-400)}
.sh-link:hover{background:rgba(245,158,11,.14);box-shadow:0 4px 16px rgba(245,158,11,.1)}
.qr-wrap{text-align:center}
.qr-wrap img{border-radius:var(--radius-sm);background:#fff;padding:6px;box-shadow:var(--shadow-md)}
.qr-wrap .qr-note{font-size:.7rem;color:var(--slate-500);margin-top:6px}

/* Toast */
.toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;
    background:var(--green-600);color:#fff;padding:12px 28px;border-radius:25px;
    font-weight:700;font-family:'Cairo',sans-serif;font-size:.88rem;
    box-shadow:0 8px 30px rgba(22,163,74,.4);
    animation:toastIn .35s cubic-bezier(.16,1,.3,1),toastOut .3s 2.2s ease-in forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-8px)}}

/* Footer */
.ft{text-align:center;margin-top:36px;padding:20px;color:var(--slate-600);font-size:.78rem}
.ft strong{color:var(--slate-500)}

/* Utils */
.hide{display:none!important}
@media(max-width:500px){
    .ranks{grid-template-columns:1fr}
    .sub-grid{grid-template-columns:1fr}
    .search-group{flex-direction:column}
    .search-group button{width:100%}
    .hero-stats{gap:8px}
    .hs-item{padding:8px 14px}
    .hs-num{font-size:1.1rem}
}
</style>
</head>
<body>

<div class="bnr">
    📢 انضم لقناتنا على تيليجرام —
    <a href="https://t.me/NovaTechEG" target="_blank">@NovaTechEG</a> 🚀
</div>

<div class="page">
    <div class="hero">
        <span class="hero-icon">🎓</span>
        <h1>نتيجة الثانوية العامة 2026</h1>
        <p>نظام حديث — البحث برقم الجلوس أو الاسم</p>
        <div class="hero-stats">
            <div class="hs-item"><div class="hs-num">919,396</div><div class="hs-lbl">طالب</div></div>
            <div class="hs-item"><div class="hs-num">320</div><div class="hs-lbl">الدرجة الكلية</div></div>
            <div class="hs-item"><div class="hs-num">3</div><div class="hs-lbl">شعب</div></div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('seat')">🔢 رقم الجلوس</button>
        <button class="tab-btn" onclick="switchTab('name')">👤 الاسم</button>
    </div>

    <!-- Seat Panel -->
    <div id="pnl-seat" class="panel active">
        <div class="search-group">
            <input type="text" id="inp-seat" placeholder="أدخل رقم الجلوس (٧ أرقام)" inputmode="numeric" autocomplete="off" autofocus>
            <button id="btn-seat" onclick="doSeatSearch()">بحث</button>
        </div>
        <div id="load-seat" class="hide spinner-wrap"><div class="spinner"></div><div style="color:var(--slate-500)">جاري البحث...</div></div>
        <div id="err-seat" class="err hide"></div>
        <div id="out-seat"></div>
    </div>

    <!-- Name Panel -->
    <div id="pnl-name" class="panel">
        <div class="search-group">
            <input type="text" id="inp-name" class="arabic" placeholder="اكتب الاسم للبحث..." autocomplete="off">
            <button id="btn-name" onclick="doNameSearch()">بحث</button>
        </div>
        <div id="load-name" class="hide spinner-wrap"><div class="spinner"></div><div style="color:var(--slate-500)">جاري البحث في 919,396 طالب...</div></div>
        <div id="err-name" class="err hide"></div>
        <div id="count-name" class="rs-count hide"></div>
        <div id="out-name"></div>
    </div>

    <div class="ft">
        <strong>NovaTech</strong> — بيانات الدور الأول 2026 — نتائج غير رسمية
    </div>
</div>

<script>
// ===== STATE =====
var currentTab='seat';
var nameIndex=null;
var nameCache={};
var BASE_URL='https://keroles-sala.me/thanawya-results-2026';

// ===== TAB =====
function switchTab(t){
    currentTab=t;
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
    if(t==='seat'){
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('pnl-seat').classList.add('active');
        document.getElementById('inp-seat').focus();
    }else{
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('pnl-name').classList.add('active');
        document.getElementById('inp-name').focus();
    }
}

// ===== HELPERS =====
function showErr(id,msg){var e=document.getElementById(id);e.textContent=msg;e.classList.remove('hide')}
function hideErr(id){document.getElementById(id).classList.add('hide')}
function clearOut(id){document.getElementById(id).innerHTML=''}
function setLoading(loadId,btnId,v){
    document.getElementById(loadId).classList.toggle('hide',!v);
    document.getElementById(btnId).disabled=v;
}
function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function resultUrl(sno){return BASE_URL+'/?s='+sno}

// ===== SEAT SEARCH =====
document.getElementById('inp-seat').addEventListener('keydown',function(e){if(e.key==='Enter')doSeatSearch();});

function doSeatSearch(){
    var sno=document.getElementById('inp-seat').value.trim();
    if(!sno)return;
    if(!/^\d{7}$/.test(sno)){showErr('err-seat','⚠️ رقم الجلوس يجب أن يكون ٧ أرقام');return;}
    setLoading('load-seat','btn-seat',true);
    hideErr('err-seat');
    clearOut('out-seat');
    fetch('data/'+sno.substring(0,4)+'.json')
        .then(function(r){if(!r.ok)throw new Error('not found');return r.json()})
        .then(function(b){var s=b[sno];if(!s)throw new Error('not found');renderCard('out-seat',sno,s)})
        .catch(function(e){showErr('err-seat','🚫 لا توجد نتيجة لرقم الجلوس '+sno)})
        .finally(function(){setLoading('load-seat','btn-seat',false)});
}

// ===== NAME SEARCH =====
document.getElementById('inp-name').addEventListener('keydown',function(e){if(e.key==='Enter')doNameSearch();});

function doNameSearch(){
    var q=document.getElementById('inp-name').value.trim();
    if(!q||q.length<3){showErr('err-name','⚠️ اكتب ٣ أحرف على الأقل');return;}
    setLoading('load-name','btn-name',true);
    hideErr('err-name');
    clearOut('out-name');
    document.getElementById('count-name').classList.add('hide');
    loadNameIdx().then(function(idx){
        var files=idx.char_groups[q[0]];
        if(!files){showErr('err-name','🚫 لا توجد نتائج');return;}
        var lq=q.toLowerCase();
        var matches=[];
        function loadNext(i){
            if(i>=files.length||matches.length>=200){done();return}
            var fn=files[i];
            var load=nameCache[fn]?Promise.resolve(nameCache[fn]):fetch(BASE_URL+'/name-search/'+fn).then(function(r){return r.json()});
            load.then(function(bucket){
                nameCache[fn]=bucket;
                for(var j=0;j<bucket.length;j++){
                    var e=bucket[j],ename=e[1];
                    if(ename.toLowerCase().startsWith(lq)){matches.push({sno:e[0],nm:ename});if(matches.length>=200)break}
                    else if(matches.length>0&&ename.toLowerCase().localeCompare(lq)>0){break}
                }
                if(matches.length<200&&i+1<files.length){loadNext(i+1)}else{done()}
            }).catch(function(){done()});
        }
        function done(){
            if(matches.length===0){showErr('err-name','🚫 لا توجد نتائج لـ "'+q+'"');setLoading('load-name','btn-name',false);return}
            var c=document.getElementById('count-name');
            c.innerHTML='تم العثور على <strong>'+matches.length+'</strong> طالب'+(matches.length>1?'ِ':'');
            c.classList.remove('hide');
            var out=document.getElementById('out-name');
            var pms=matches.map(function(m){
                var p=m.sno.substring(0,4);
                return fetch(BASE_URL+'/data/'+p+'.json')
                    .then(function(r){return r.ok?r.json():null})
                    .then(function(b){
                        if(b&&b[m.sno]){renderCard(out,m.sno,b[m.sno])}
                        else{out.innerHTML+='<div class="card"><div class="card-head">🔍 نتيجة</div><div class="card-body"><div class="name-block"><div class="s-name">'+escapeHtml(m.nm)+'</div><div class="s-seat">رقم الجلوس: '+m.sno+'</div></div></div></div>'}
                    });
            });
            Promise.all(pms).finally(function(){setLoading('load-name','btn-name',false)});
        }
        loadNext(0);
    }).catch(function(){showErr('err-name','حدث خطأ. حاول مرة أخرى.');setLoading('load-name','btn-name',false)});
}

function loadNameIdx(){
    if(nameIndex)return Promise.resolve(nameIndex);
    return fetch(BASE_URL+'/name-search/char_index.json').then(function(r){return r.json()}).then(function(d){nameIndex=d;return d});
}

// ===== RENDER CARD =====
function renderCard(containerId,sno,s){
    var isOk=s.c.indexOf('ناجح')>=0||(s.st&&s.st.indexOf('ناجح')>=0);
    var cardId='c'+Date.now();
    var h='';

    // Card start
    h+='<div class="card" id="'+cardId+'">';
    h+='<div class="card-head '+(isOk?'success':'fail')+'"><span class="dot '+(isOk?'green':'red')+'"></span> '+(isOk?'✅':'⚠️')+' نتيجة الطالب</div>';
    h+='<div class="card-body">';

    // Name
    h+='<div class="name-block"><div class="s-name">'+escapeHtml(s.n)+'</div><div class="s-seat">رقم الجلوس: '+sno+'</div></div>';

    // Tags
    if(s.b||s.s||s.pct){
        h+='<div class="tags">';
        if(s.b)h+='<span class="tag tag-branch">🎓 '+escapeHtml(s.b)+'</span>';
        if(s.s)h+='<span class="tag tag-school">🏫 '+escapeHtml(s.s)+'</span>';
        if(s.pct)h+='<span class="tag tag-pct">📊 '+escapeHtml(s.pct)+'</span>';
        h+='</div>';
    }

    // Score
    h+='<div class="score-zone"><div class="score-ring"><span class="score-num">'+s.d+'</span><span class="score-max">من 320</span></div></div>';

    // Status
    var st=s.st||s.c;
    h+='<div class="status-line"><span class="sl-lbl">الحالة</span><span class="sl-val '+(isOk?'ok':'no')+'">'+escapeHtml(st)+'</span></div>';

    // Ranks
    h+='<div class="ranks">';
    if(s.rank){var rt=typeof s.rank==='number'?'#'+s.rank.toLocaleString('en-US'):'#'+s.rank;h+='<div class="rank-cell"><div class="rk-icon">🏆</div><div class="rk-lbl">الترتيب العام</div><div class="rk-val">'+rt+'</div></div>';}
    if(s.rk_b){var rtb=typeof s.rk_b==='number'?'#'+s.rk_b.toLocaleString('en-US'):'#'+s.rk_b;h+='<div class="rank-cell"><div class="rk-icon">🎯</div><div class="rk-lbl">الترتيب في '+(s.b||'غير محدد')+'</div><div class="rk-val">'+rtb+'</div></div>';}
    h+='</div>';

    // Subjects
    if(s.sub&&s.sub.length>0){
        h+='<div class="subjects"><h4>📝 درجات المواد</h4><div class="sub-grid">';
        for(var i=0;i<s.sub.length;i++){
            var su=s.sub[i],mk=su.mark||'';
            var na=mk.indexOf('غير مقرر')>=0||mk.indexOf('غائب')>=0;
            h+='<div class="sub-item"><span class="si-name">'+escapeHtml(su.subject)+'</span><span class="si-mark'+(na?' na':'')+'">'+(mk||'—')+'</span></div>';
        }
        h+='</div></div>';
    }

    h+='</div>'; // card-body

    // Share
    h+='<div class="share-bar">';
    h+='<div class="sh-title">📤 شارك النتيجة</div>';
    h+='<div class="share-grid">';
    h+='<button class="sh-btn sh-wa" data-action="wa" data-sno="'+sno+'" data-name="'+escapeHtml(s.n)+'" data-deg="'+s.d+'" data-branch="'+(s.b||'')+'">💬 واتساب</button>';
    h+='<button class="sh-btn sh-tg" data-action="tg" data-sno="'+sno+'" data-name="'+escapeHtml(s.n)+'" data-deg="'+s.d+'" data-branch="'+(s.b||'')+'">✈️ تيليجرام</button>';
    h+='<button class="sh-btn sh-img" data-action="img" data-card="'+cardId+'" data-sno="'+sno+'">🖼️ تحميل كصورة</button>';
    h+='<button class="sh-btn sh-link" data-action="link" data-sno="'+sno+'">🔗 نسخ الرابط</button>';
    h+='</div>';
    h+='<div class="qr-wrap"><img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&data='+encodeURIComponent(resultUrl(sno))+'" alt="QR" onerror="this.style.display=\'none\'"><div class="qr-note">اسكن الكود لعرض النتيجة</div></div>';
    h+='</div>';

    h+='</div>'; // card

    var out=document.getElementById(containerId);
    out.innerHTML+=h;

    // Attach share handlers using event delegation
    var card=document.getElementById(cardId);
    card.querySelectorAll('.sh-btn').forEach(function(btn){
        btn.addEventListener('click',function(){
            var act=this.dataset.action;
            if(act==='wa')shareWA(this.dataset.sno,this.dataset.name,this.dataset.deg,this.dataset.branch);
            if(act==='tg')shareTG(this.dataset.sno,this.dataset.name,this.dataset.deg,this.dataset.branch);
            if(act==='img')downloadCard(this.dataset.card,this.dataset.sno);
            if(act==='link')copyLink(this.dataset.sno);
        });
    });
}

// ===== SHARE =====
function shareWA(sno,name,deg,branch){
    var msg='🎓 *نتيجة الثانوية العامة 2026*%0A%0A👤 *الاسم:* '+name+'%0A🔢 *رقم الجلوس:* '+sno+'%0A📊 *المجموع:* '+deg+' / 320%0A';
    if(branch)msg+='🎯 *الشعبة:* '+branch+'%0A';
    msg+='%0A🔗 شوف نتيجتك كاملة:%0A'+resultUrl(sno)+'%0A%0A✨ *ألف مبروك ومن نجاح لنجاح يارب!* 🥰❤️';
    window.open('https://wa.me/?text='+msg,'_blank');
}
function shareTG(sno,name,deg,branch){
    var msg='🎓 *نتيجة الثانوية العامة 2026*%0A%0A👤 *الاسم:* '+name+'%0A🔢 *رقم الجلوس:* '+sno+'%0A📊 *المجموع:* '+deg+' / 320%0A';
    if(branch)msg+='🎯 *الشعبة:* '+branch+'%0A';
    msg+='%0A🔗 شوف نتيجتك كاملة:%0A'+resultUrl(sno)+'%0A%0A✨ *ألف مبروك ومن نجاح لنجاح يارب!* 🥰❤️';
    window.open('https://t.me/share/url?url='+encodeURIComponent(resultUrl(sno))+'&text='+encodeURIComponent(msg),'_blank');
}
function downloadCard(cardId,sno){
    var card=document.getElementById(cardId);
    var share=card.querySelector('.share-bar');
    if(share)share.style.display='none';
    html2canvas(card,{backgroundColor:'#020617',scale:2,useCORS:true,logging:false}).then(function(c){
        if(share)share.style.display='';
        var a=document.createElement('a');a.download='نتيجة-'+sno+'.png';a.href=c.toDataURL('image/png');a.click();
        toast('✅ تم تحميل الصورة!');
    }).catch(function(){if(share)share.style.display='';toast('❌ حدث خطأ');});
}
function copyLink(sno){
    var url=resultUrl(sno);
    if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast('✅ تم نسخ الرابط!')});return}
    var ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);toast('✅ تم نسخ الرابط!');
}
function toast(msg){
    var t=document.createElement('div');t.className='toast';t.textContent=msg;
    document.body.appendChild(t);setTimeout(function(){t.remove()},2600);
}
