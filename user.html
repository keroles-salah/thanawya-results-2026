<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>نتيجة الثانوية العامة 2026 — بحث بدون درجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--c-bg:#0a0a0f;--c-card:#141420;--c-border:#222233;--c-input:#0f0f15;--c-primary:#f1f5f9;--c-secondary:#94a3b8;--c-muted:#64748b;--c-success:#22c55e;--c-danger:#ef4444;--c-gold:#f59e0b;--c-blue:#3b82f6;--c-blue-hover:#2563eb;--r:12px;--r-sm:8px}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--c-bg);color:var(--c-primary);min-height:100vh;line-height:1.7;padding-top:44px}
.bnr{position:fixed;top:0;left:0;right:0;z-index:50;height:44px;background:var(--c-tg);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.8rem;font-weight:600}
.bnr a{color:#fff;font-weight:800;text-decoration:none;background:rgba(255,255,255,.18);padding:3px 12px;border-radius:20px;transition:background .2s}
.bnr a:hover{background:rgba(255,255,255,.28)}
.page{max-width:640px;margin:0 auto;padding:28px 16px 56px}
.hero{text-align:center;padding:40px 0 32px}
.hero h1{font-size:clamp(1.5rem,4.5vw,1.95rem);font-weight:900;color:#fff;margin-bottom:4px;letter-spacing:-.02em}
.hero p{color:var(--c-secondary);font-size:.9rem;font-weight:500}
.hero-stats{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.hs{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-sm);padding:12px 20px;text-align:center;min-width:100px;transition:border-color .25s}
.hs-num{font-size:1.3rem;font-weight:800;color:var(--c-blue)}
.hs-lbl{font-size:.7rem;color:var(--c-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:20px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-sm);padding:4px}
.tb{padding:12px 16px;border:none;background:transparent;color:var(--c-secondary);font-size:.9rem;font-weight:600;font-family:'Cairo',sans-serif;cursor:pointer;border-radius:6px;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px}
.tb.act{background:var(--c-blue);color:#fff}
.tb:hover:not(.act){color:var(--c-primary);background:rgba(255,255,255,.03)}
.pnl{display:none}.pnl.act{display:block}
.sg{display:flex;gap:8px;margin-bottom:18px}
.sg input{flex:1;padding:14px 18px;border:1px solid var(--c-border);border-radius:var(--r-sm);background:var(--c-input);color:#fff;font-size:1.05rem;font-family:'Cairo',sans-serif;outline:none;transition:border-color .25s;direction:ltr;text-align:center;letter-spacing:.06em;font-weight:700}
.sg input:focus{border-color:var(--c-blue)}
.sg input::placeholder{color:var(--c-muted);letter-spacing:0;font-weight:400;font-size:.9rem}
.sg input.ar{direction:rtl;text-align:right;letter-spacing:0;font-weight:500}
.sg button{padding:14px 24px;border:none;border-radius:var(--r-sm);background:var(--c-blue);color:#fff;font-size:1rem;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:all .25s;white-space:nowrap}
.sg button:hover{background:var(--c-blue-hover);transform:translateY(-1px)}
.sg button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.sk-wrap{text-align:center;padding:32px}
.sk{width:28px;height:28px;border:3px solid var(--c-border);border-top-color:var(--c-blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.12);border-radius:var(--r-sm);padding:16px 20px;color:#fca5a5;text-align:center;font-size:.9rem;margin-bottom:12px}
.rc{text-align:center;padding:10px 16px;margin-bottom:10px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.1);border-radius:var(--r-sm);color:var(--c-blue);font-weight:600;font-size:.82rem}
.rc strong{color:#93c5fd}
.card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.5);margin-bottom:16px;animation:slideUp .45s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ch{padding:16px 24px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.05rem;font-weight:700;color:#fff;border-bottom:1px solid var(--c-border)}
.ch.ok{background:rgba(34,197,94,.04)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c-success);box-shadow:0 0 8px rgba(34,197,94,.3)}
.cb{padding:24px;text-align:center}
.nm{font-size:1.3rem;font-weight:800;color:#fff;line-height:1.7;margin-bottom:6px}
.sn{font-size:.8rem;color:var(--c-muted);margin-bottom:18px}
.result-card-btn{display:inline-block;background:var(--c-blue);color:#fff;border:none;padding:12px 32px;border-radius:var(--r-sm);font-family:'Cairo',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .25s;text-decoration:none}
.result-card-btn:hover{background:var(--c-blue-hover);transform:translateY(-2px);box-shadow:0 4px 16px rgba(59,130,246,.35)}
.hide{display:none!important}
@media(max-width:500px){.hero{padding:24px 0}.sg{flex-direction:column}.sg button{width:100%}.cb{padding:18px}.ch{padding:14px 18px}}
</style>
</head>
<body>
<div class="bnr">📢 انضم لقناتنا على تيليجرام — <a href="https://t.me/NovaTechEG" target="_blank" rel="noopener">@NovaTechEG</a> 🚀</div>
<div class="page">
<div class="hero">
<h1>🎓 نتيجة الثانوية العامة 2026</h1>
<p>نظام حديث — البحث برقم الجلوس أو الاسم</p>
<div class="hero-stats">
<div class="hs"><div class="hs-num">919,396</div><div class="hs-lbl">طالب</div></div>
<div class="hs"><div class="hs-num">320</div><div class="hs-lbl">الدرجة الكلية</div></div>
<div class="hs"><div class="hs-num">3</div><div class="hs-lbl">شعب</div></div>
</div>
</div>
<div class="tabs" id="tabs">
<button class="tb act" data-tab="seat">🔢 رقم الجلوس</button>
<button class="tb" data-tab="name">👤 الاسم</button>
</div>
<div class="pnl act" id="pnl-seat">
<div class="sg">
<input type="text" id="inp-seat" placeholder="ادخل رقم الجلوس (٧ ارقام)" inputmode="numeric" autocomplete="off" autofocus>
<button id="btn-seat">بحث</button>
</div>
<div id="load-seat" class="sk-wrap hide"><div class="sk"></div><div>جاري البحث...</div></div>
<div id="err-seat" class="err hide"></div>
<div id="out-seat"></div>
</div>
<div class="pnl" id="pnl-name">
<div class="sg">
<input type="text" id="inp-name" class="ar" placeholder="اكتب الاسم للبحث..." autocomplete="off">
<button id="btn-name">بحث</button>
</div>
<div id="load-name" class="sk-wrap hide"><div class="sk"></div><div>جاري البحث...</div></div>
<div id="err-name" class="err hide"></div>
<div id="cnt-name" class="rc hide"></div>
<div id="out-name"></div>
</div>
</div>

<script>
var BASE='https://keroles-sala.me/thanawya-results-2026';
var nameDB=null;

/* Tabs */
document.getElementById('tabs').onclick=function(e){
    var b=e.target.closest('.tb');if(!b)return;
    this.querySelectorAll('.tb').forEach(function(x){x.classList.remove('act')});
    b.classList.add('act');
    document.querySelectorAll('.pnl').forEach(function(p){p.classList.remove('act')});
    document.getElementById('pnl-'+b.dataset.tab).classList.add('act');
};

/* Helpers */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(n){return Number(n).toLocaleString('en-US')}
function rurl(s){return BASE+'/?s='+s}

/* Seat search */
document.getElementById('inp-seat').onkeydown=function(e){if(e.key==='Enter')doSeat()};
document.getElementById('btn-seat').onclick=doSeat;
function doSeat(){
    var sno=document.getElementById('inp-seat').value.trim();
    if(!/^\d{7}$/.test(sno))return;
    var load=document.getElementById('load-seat'),btn=document.getElementById('btn-seat'),out=document.getElementById('out-seat'),err=document.getElementById('err-seat');
    load.classList.remove('hide');btn.disabled=true;err.classList.add('hide');out.innerHTML='';
    var ac=new AbortController();setTimeout(function(){ac.abort()},10000);
    fetch(BASE+'/data/'+sno.substring(0,4)+'.json',{signal:ac.signal}).then(function(r){return r.ok?r.json():null}).then(function(d){
        if(!d||!d[sno]){err.classList.remove('hide');err.textContent='لا توجد نتيجة لرقم الجلوس '+sno;return}
        var s=d[sno],ok=s.c.indexOf('ناجح')>=0||(s.st||'').indexOf('ناجح')>=0,st=s.st||s.c;
        var h='';
        h+='<div class="card"><div class="ch ok"><span class="dot"></span> نتيجة الطالب</div><div class="cb">';
        h+='<div class="nm">'+esc(s.n)+'</div><div class="sn">رقم الجلوس: '+sno+'</div>';
        if(s.b)h+='<div style="display:inline-block;background:rgba(139,92,246,.08);color:#c4b5fd;border:1px solid rgba(139,92,246,.15);border-radius:20px;padding:6px 14px;font-size:.76rem;font-weight:600;margin-bottom:16px">🎓 '+esc(s.b)+'</div>';
        h+='<div style="margin-bottom:16px"><div style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:100px;height:100px;border-radius:50%;background:rgba(245,158,11,.05);border:2px solid rgba(245,158,11,.15)"><span style="font-size:2rem;font-weight:900;color:#f59e0b">'+s.d+'</span><span style="font-size:.68rem;color:var(--c-muted)">من 320</span></div></div>';
        h+='<div style="display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--c-border);border-bottom:1px solid var(--c-border);margin-bottom:16px"><span style="font-size:.82rem;color:var(--c-secondary)">الحالة</span><span style="font-weight:700;color:'+(ok?'#22c55e':'#ef4444')+'">'+esc(st)+'</span></div>';
        if(s.rank||s.rk_b){h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';if(s.rank)h+='<div style="background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;padding:16px;text-align:center"><div>🏆</div><div style="font-size:.68rem;color:var(--c-muted)">الترتيب العام</div><div style="font-size:1.1rem;font-weight:800;color:#f59e0b">#'+fmt(s.rank)+'</div></div>';if(s.rk_b)h+='<div style="background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;padding:16px;text-align:center"><div>🎯</div><div style="font-size:.68rem;color:var(--c-muted)">في '+(s.b||'غير محدد')+'</div><div style="font-size:1.1rem;font-weight:800;color:#f59e0b">#'+fmt(s.rk_b)+'</div></div>';h+='</div>'}
        h+='<div style="text-align:center"><a class="result-card-btn" href="'+rurl(sno)+'" target="_blank">عرض النتيجة كاملة</a></div>';
        h+='</div></div>';
        out.innerHTML=h;
    }).catch(function(){err.classList.remove('hide');err.textContent='لا توجد نتيجة لرقم الجلوس '+sno}).finally(function(){load.classList.add('hide');btn.disabled=false});
}

/* Name search — loads name DB once, then searches locally (instant!) */
document.getElementById('inp-name').onkeydown=function(e){if(e.key==='Enter')doName()};
document.getElementById('btn-name').onclick=doName;

function doName(){
    var q=document.getElementById('inp-name').value.trim();
    if(!q||q.length<3){document.getElementById('err-name').classList.remove('hide');document.getElementById('err-name').textContent='اكتب ٣ احرف على الاقل';return}
    var load=document.getElementById('load-name'),btn=document.getElementById('btn-name'),cnt=document.getElementById('cnt-name'),out=document.getElementById('out-name'),err=document.getElementById('err-name');
    load.classList.remove('hide');btn.disabled=true;err.classList.add('hide');out.innerHTML='';cnt.classList.add('hide');
    
    /* Step 1: Load char index (small, fast) */
    fetch(BASE+'/name-search/char_index.json').then(function(r){return r.json()}).then(function(idx){
        var files=idx.char_groups[q[0]];
        if(!files){err.classList.remove('hide');err.textContent='لا توجد نتائج للبحث';load.classList.add('hide');btn.disabled=false;return;}
        var allBuckets={},loaded=0,total=files.length,lq=q.toLowerCase(),matches=[];
        cnt.classList.remove('hide');cnt.innerHTML='0 / '+total+' ملف...';
        /* Step 2: Load ALL name-search files in parallel (no batches, just go!) */
        files.forEach(function(fn){
            fetch(BASE+'/name-search/'+fn).then(function(r){return r.json()}).then(function(bucket){
                allBuckets[fn]=bucket;
                loaded++;cnt.innerHTML=loaded+' / '+total+' ملف...';
                if(loaded>=total)renderResults();
            }).catch(function(){
                loaded++;cnt.innerHTML=loaded+' / '+total+' ملف...';
                if(loaded>=total)renderResults();
            });
        });
        /* Step 3: When all loaded, search and render */
        function renderResults(){
            load.classList.add('hide');btn.disabled=false;
            /* Search across all loaded buckets */
            var sortedKeys=Object.keys(allBuckets).sort();
            for(var i=0;i<sortedKeys.length;i++){
                var bucket=allBuckets[sortedKeys[i]];if(!bucket)continue;
                for(var j=0;j<bucket.length;j++){
                    var ename=bucket[j][1];
                    if(ename.toLowerCase().startsWith(lq)){
                        matches.push(bucket[j]);
                        if(matches.length>=200){i=sortedKeys.length;break;}
                    }
                }
            }
            if(matches.length===0){err.classList.remove('hide');err.textContent='لا توجد نتائج لـ "'+q+'"';cnt.classList.add('hide');return;}
            cnt.innerHTML='تم العثور على '+matches.length+' طالب';
            /* Build HTML */
            var html='';
            for(var k=0;k<matches.length;k++){
                var m=matches[k],sno=m[0],nm=m[1];
                html+='<div class="card"><div class="ch ok"><span class="dot"></span> نتيجة الطالب</div><div class="cb"><div class="nm">'+esc(nm)+'</div><div class="sn">رقم الجلوس: '+sno+'</div><a class="result-card-btn" href="'+rurl(sno)+'" target="_blank">عرض النتيجة كاملة</a></div></div>';
            }
            out.innerHTML=html;
        }
    }).catch(function(){err.classList.remove('hide');err.textContent='حدث خطأ — حاول مرة اخرى';load.classList.add('hide');btn.disabled=false;});
}

/* Firebase */
!function(){try{
    var vk='visitors/'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
    fetch('https://f-o-x-284eb-default-rtdb.firebaseio.com/'+vk+'.json',{method:'PUT',body:JSON.stringify({page:'user',ref:document.referrer||'direct',time:new Date().toISOString()})});
    fetch('https://f-o-x-284eb-default-rtdb.firebaseio.com/analytics/total.json').then(function(r){return r.json()}).then(function(d){fetch('https://f-o-x-284eb-default-rtdb.firebaseio.com/analytics/total.json',{method:'PUT',body:JSON.stringify((d||0)+1)})});
}catch(e){}}();

/* Auto-search from URL */
!function(){
    var p=new URLSearchParams(location.search),s=p.get('s');
    if(s&&/^\d{7}$/.test(s)){document.getElementById('inp-seat').value=s;setTimeout(doSeat,400)}
    }();
</script>
</body>
</html>
